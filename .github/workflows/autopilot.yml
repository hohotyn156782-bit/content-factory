name: autopilot

# Автопостинг v2: раздельный контент по площадкам, крон разносит выходы по дню (МСК = UTC+3).
#   08:00 UTC (11 МСК) → ig_vk   : видео → Instagram Reels + VK Клипы (авто)
#   11:00 UTC (14 МСК) → youtube : видео → TG Паше (ручная выкладка)
#   14:00 UTC (17 МСК) → text    : текст-история-сериал → Threads + VK сообщество (авто)
#   17:00 UTC (20 МСК) → tiktok  : видео → TG Даше (ручная выкладка)
# Сейчас крон ЗАКОММЕНТИРОВАН — тест через workflow_dispatch. Включить после успешного теста.

on:
  workflow_dispatch:
    inputs:
      output:
        description: "выход: ig_vk | text | youtube | tiktok"
        required: true
        default: "ig_vk"
      niche:
        description: "ниша (пусто = все подходящие)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 8 * * *"    # ig_vk
  #   - cron: "0 11 * * *"   # youtube
  #   - cron: "0 14 * * *"   # text
  #   - cron: "0 17 * * *"   # tiktok

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.MEDIA_PAT }}   # media_host пушит видео в cf-media → raw URL для IG/Threads
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Записать секреты
        env:
          SECRETS_ENV: ${{ secrets.SECRETS_ENV }}
        run: |
          mkdir -p ~/.config/content-factory
          printf '%s' "$SECRETS_ENV" > ~/.config/content-factory/secrets.env
      - name: Выбрать выход (по cron-времени или вручную)
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 8 * * *")  OUT=ig_vk ;;
            "0 11 * * *") OUT=youtube ;;
            "0 14 * * *") OUT=text ;;
            "0 17 * * *") OUT=tiktok ;;
            *)            OUT="${{ github.event.inputs.output }}" ;;
          esac
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "Выход: $OUT"
      - name: Сгенерировать и выложить
        run: python3 factory.py v2 "${{ steps.pick.outputs.out }}" ${{ github.event.inputs.niche }}
      - name: Сохранить состояние сериалов (CI эфемерный → коммит-бэк)
        if: always()
        run: |
          git config user.email "autopilot@content-factory"
          git config user.name "cf-autopilot"
          if [ -n "$(git status --porcelain state/ 2>/dev/null)" ]; then
            git add state/
            git pull --rebase --autostash origin master || true
            git commit -m "state: серийное состояние [skip ci]" || true
            git push origin master || true
          fi
